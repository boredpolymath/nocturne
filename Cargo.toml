[workspace]
resolver = "2"
members = ["src-tauri"]

[workspace.package]
version = "1.0.4"
edition = "2021"
rust-version = "1.77.2"
authors = ["Project Nocturne Core Team"]
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = "warn"

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
lto = true
strip = "symbols"
codegen-units = 1
opt-level = "s"
