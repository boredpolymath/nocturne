name: Release Integrity & Supply Chain Security

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  supply-chain-audit:
    name: Cargo Audit, Cargo Deny & Air-Gap Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check Rust Formatting
        run: cargo fmt --all -- --check

      - name: Run Cargo Deny (Bans, Licenses, Sources)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans licenses sources

      - name: Verify Zero Network Egress Across Desktop Targets
        run: |
          for target in x86_64-unknown-linux-gnu x86_64-pc-windows-msvc aarch64-apple-darwin x86_64-apple-darwin; do
            out=$(cargo tree -i reqwest --target "$target" 2>&1 || true)
            if echo "$out" | grep -q "reqwest v"; then
              echo "Forbidden network crate reqwest detected on $target"
              exit 1
            fi
          done

      - name: Generate CycloneDX SBOM & Reproducible SHA-256 Checksums
        run: python3 scripts/generate_release_integrity.py --verify

  release-matrix:
    name: Hardened Multi-Platform Build & Code Signing
    needs: supply-chain-audit
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux System Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libasound2-dev libxss-dev libxrandr-dev

      - name: Install Rust Toolchain for Target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Generate SBOM & SHA-256 Checksums
        run: python3 scripts/generate_release_integrity.py

      - name: Build Target Binary
        run: cargo check --workspace --target ${{ matrix.target }}
