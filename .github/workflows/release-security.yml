name: Release Integrity & Supply Chain Security

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  supply-chain-audit:
    name: Cargo Audit, Cargo Deny & Air-Gap Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check Rust Formatting
        run: cargo fmt --all -- --check

      - name: Run Cargo Deny (Bans, Licenses, Sources)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans licenses sources

      - name: Verify Zero Network Egress Across Desktop Targets
        run: |
          for target in x86_64-unknown-linux-gnu x86_64-pc-windows-msvc aarch64-apple-darwin x86_64-apple-darwin; do
            out=$(cargo tree -i reqwest --target "$target" 2>&1 || true)
            if echo "$out" | grep -q "reqwest v"; then
              echo "Forbidden network crate reqwest detected on $target"
              exit 1
            fi
          done

      - name: Generate CycloneDX SBOM & Reproducible SHA-256 Checksums
        run: python3 scripts/generate_release_integrity.py --verify

  release-matrix:
    name: Build & Package Desktop Executable Deliverables
    needs: supply-chain-audit
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            target: aarch64-apple-darwin
            archive_name: nocturne-aarch64-apple-darwin.tar.gz
            alias_name: nocturne-macos-arm64.tar.gz
            binary_name: nocturne-daemon
            is_windows: false
            is_macos: true
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive_name: nocturne-x86_64-apple-darwin.tar.gz
            alias_name: nocturne-macos-x64.tar.gz
            binary_name: nocturne-daemon
            is_windows: false
            is_macos: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_name: nocturne-x86_64-pc-windows-msvc.zip
            alias_name: nocturne-windows-x64.zip
            binary_name: nocturne-daemon.exe
            is_windows: true
            is_macos: false
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_name: nocturne-x86_64-unknown-linux-gnu.tar.gz
            alias_name: nocturne-linux-x86_64.tar.gz
            binary_name: nocturne-daemon
            is_windows: false
            is_macos: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux System Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libasound2-dev libxss-dev libxrandr-dev

      - name: Install Rust Toolchain for Target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Target Executable
        run: cargo build --workspace --release --target ${{ matrix.target }}

      - name: Setup macOS Signing & Notarization
        if: matrix.is_macos && env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -t 3600 -u "$KEYCHAIN_PATH"

          CERT_PATH=$RUNNER_TEMP/certificate.p12
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Build and Notarize macOS DMG
        if: matrix.is_macos
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          npm install --no-audit --no-fund
          npx tauri build --target ${{ matrix.target }} --bundles dmg,app || true
          dmgFiles=$(find target src-tauri/target -name "*.dmg" 2>/dev/null || true)
          if [ -n "$dmgFiles" ]; then
            for f in $dmgFiles; do
              cp "$f" "$(basename "$f")"
              if [[ "${{ matrix.target }}" == "aarch64-apple-darwin" ]]; then
                cp "$f" "nocturne-macos-arm64.dmg"
              else
                cp "$f" "nocturne-macos-x64.dmg"
              fi
            done
          fi

      - name: Build Windows Installers (MSI & NSIS EXE)
        if: matrix.is_windows
        shell: pwsh
        run: |
          npm install --no-audit --no-fund
          npx tauri build --target ${{ matrix.target }} --bundles msi,nsis
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $msiFiles = Get-ChildItem -Path "target", "src-tauri\target" -Filter "*.msi" -Recurse -ErrorAction SilentlyContinue
          if (-not $msiFiles) { Write-Error "No MSI installer found"; exit 1 }
          foreach ($f in $msiFiles) {
            Copy-Item -Path $f.FullName -Destination $f.Name -Force
            Copy-Item -Path $f.FullName -Destination "nocturne-windows-x64.msi" -Force
          }
          $nsisFiles = Get-ChildItem -Path "target", "src-tauri\target" -Filter "*-setup.exe" -Recurse -ErrorAction SilentlyContinue
          if (-not $nsisFiles) { Write-Error "No NSIS setup.exe installer found"; exit 1 }
          foreach ($f in $nsisFiles) {
            Copy-Item -Path $f.FullName -Destination $f.Name -Force
            Copy-Item -Path $f.FullName -Destination "nocturne-windows-x64-setup.exe" -Force
          }

      - name: Build MSIX Package for Microsoft Store
        if: matrix.is_windows
        shell: pwsh
        env:
          MSIX_PACKAGE_NAME: ${{ secrets.MSIX_PACKAGE_NAME }}
          MSIX_PUBLISHER: ${{ secrets.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ secrets.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: |
          .\scripts\build-msix.ps1 -Version "1.4.7.0" -OutputFile "nocturne-windows-x64.msix"

      - name: Package Deliverable (Unix)
        if: "!matrix.is_windows"
        run: |
          chmod +x target/${{ matrix.target }}/release/${{ matrix.binary_name }}
          tar -czvf ${{ matrix.archive_name }} -C target/${{ matrix.target }}/release ${{ matrix.binary_name }}
          if [ -n "${{ matrix.alias_name }}" ]; then
            cp "${{ matrix.archive_name }}" "${{ matrix.alias_name }}"
          fi

      - name: Package Deliverable (Windows)
        if: matrix.is_windows
        shell: pwsh
        run: |
          Compress-Archive -Path target\${{ matrix.target }}\release\${{ matrix.binary_name }} -DestinationPath ${{ matrix.archive_name }} -Force
          if ("${{ matrix.alias_name }}") {
            Copy-Item -Path "${{ matrix.archive_name }}" -Destination "${{ matrix.alias_name }}"
          }

      - name: Upload Deliverable Artifact
        uses: actions/upload-artifact@v7
        with:
          name: deliverable-${{ matrix.target }}
          path: |
            ${{ matrix.archive_name }}
            ${{ matrix.alias_name }}
            *.msi
            *-setup.exe
            *.dmg
            *.msix
          if-no-files-found: error

  publish-release:
    name: Publish Release Deliverables to GitHub
    needs: [supply-chain-audit, release-matrix]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Download All Deliverables
        uses: actions/download-artifact@v8
        with:
          pattern: deliverable-*
          path: dist
          merge-multiple: true

      - name: Compute Deliverable Checksums
        run: |
          cd dist
          ls -la
          sha256sum * > SHA256SUMS-DELIVERABLES.txt
          cat SHA256SUMS-DELIVERABLES.txt

      - name: Publish Deliverables to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
            if ! gh release view "$TAG" >/dev/null 2>&1; then
              echo "Creating release $TAG..."
              gh release create "$TAG" --title "Nocturne $TAG" --generate-notes
            fi
          else
            TAG=$(gh release view --json tagName -q .tagName 2>/dev/null || echo "v0.1.0")
          fi
          echo "Publishing deliverables to release tag: $TAG"
          gh release upload "$TAG" dist/* --clobber
