name: Release Integrity & Supply Chain Security

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  supply-chain-audit:
    name: Cargo Audit, Cargo Deny & Air-Gap Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check Rust Formatting
        run: cargo fmt --all -- --check

      - name: Run Cargo Deny (Bans, Licenses, Sources)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans licenses sources

      - name: Verify Zero Network Egress Across Desktop Targets
        run: |
          for target in x86_64-unknown-linux-gnu x86_64-pc-windows-msvc aarch64-apple-darwin x86_64-apple-darwin; do
            out=$(cargo tree -i reqwest --target "$target" 2>&1 || true)
            if echo "$out" | grep -q "reqwest v"; then
              echo "Forbidden network crate reqwest detected on $target"
              exit 1
            fi
          done

      - name: Generate CycloneDX SBOM & Reproducible SHA-256 Checksums
        run: python3 scripts/generate_release_integrity.py --verify

  release-matrix:
    name: Build & Package Desktop Executable Deliverables
    needs: supply-chain-audit
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            archive_name: nocturne-aarch64-apple-darwin.tar.gz
            alias_name: nocturne-macos-arm64.tar.gz
            binary_name: nocturne-daemon
            is_windows: false
          - os: macos-latest
            target: x86_64-apple-darwin
            archive_name: nocturne-x86_64-apple-darwin.tar.gz
            alias_name: nocturne-macos-x64.tar.gz
            binary_name: nocturne-daemon
            is_windows: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_name: nocturne-x86_64-pc-windows-msvc.zip
            alias_name: nocturne-windows-x64.zip
            binary_name: nocturne-daemon.exe
            is_windows: true
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_name: nocturne-x86_64-unknown-linux-gnu.tar.gz
            alias_name: nocturne-linux-x86_64.tar.gz
            binary_name: nocturne-daemon
            is_windows: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux System Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libasound2-dev libxss-dev libxrandr-dev

      - name: Install Rust Toolchain for Target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Target Executable
        run: cargo build --workspace --release --target ${{ matrix.target }}

      - name: Package Deliverable (Unix)
        if: "!matrix.is_windows"
        run: |
          chmod +x target/${{ matrix.target }}/release/${{ matrix.binary_name }}
          tar -czvf ${{ matrix.archive_name }} -C target/${{ matrix.target }}/release ${{ matrix.binary_name }}
          if [ -n "${{ matrix.alias_name }}" ]; then
            cp "${{ matrix.archive_name }}" "${{ matrix.alias_name }}"
          fi

      - name: Package Deliverable (Windows)
        if: matrix.is_windows
        shell: pwsh
        run: |
          Compress-Archive -Path target\${{ matrix.target }}\release\${{ matrix.binary_name }} -DestinationPath ${{ matrix.archive_name }} -Force
          if ("${{ matrix.alias_name }}") {
            Copy-Item -Path "${{ matrix.archive_name }}" -Destination "${{ matrix.alias_name }}"
          }

      - name: Upload Deliverable Artifact
        uses: actions/upload-artifact@v7
        with:
          name: deliverable-${{ matrix.target }}
          path: |
            ${{ matrix.archive_name }}
            ${{ matrix.alias_name }}
          if-no-files-found: error

  publish-release:
    name: Publish Release Deliverables to GitHub
    needs: [supply-chain-audit, release-matrix]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download All Deliverables
        uses: actions/download-artifact@v4
        with:
          pattern: deliverable-*
          path: dist
          merge-multiple: true

      - name: Compute Deliverable Checksums
        run: |
          cd dist
          ls -la
          sha256sum * > SHA256SUMS-DELIVERABLES.txt
          cat SHA256SUMS-DELIVERABLES.txt

      - name: Publish Deliverables to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
            if ! gh release view "$TAG" >/dev/null 2>&1; then
              echo "Creating release $TAG..."
              gh release create "$TAG" --title "Nocturne $TAG" --generate-notes
            fi
          else
            TAG=$(gh release view --json tagName -q .tagName 2>/dev/null || echo "v0.1.0")
          fi
          echo "Publishing deliverables to release tag: $TAG"
          gh release upload "$TAG" dist/* --clobber
