# Project Nocturne (MK-IV) — Cargo-Deny Configuration
# Enforces Zero Network Egress (Section 3.2 / 4.1) and Supply Chain Integrity (Section 4.6)

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Explicitly ban all HTTP, WebSocket, TLS, and Tauri network/updater/shell crates
# to guarantee an air-gapped binary with zero network egress capability.
deny = [
    { name = "reqwest" },
    { name = "hyper" },
    { name = "ureq" },
    { name = "curl" },
    { name = "curl-sys" },
    { name = "tokio-tungstenite" },
    { name = "tungstenite" },
    { name = "surf" },
    { name = "isahc" },
    { name = "attohttpc" },
    { name = "minreq" },
    { name = "h2" },
    { name = "quinn" },
    { name = "rustls" },
    { name = "native-tls" },
    { name = "openssl" },
    { name = "openssl-sys" },
    { name = "tauri-plugin-http" },
    { name = "tauri-plugin-updater" },
    { name = "tauri-plugin-shell" },
    { name = "tauri-plugin-websocket" },
    { name = "tauri-plugin-upload" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
